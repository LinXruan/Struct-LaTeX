name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify tag matches manifest.json and versions.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -e "console.log(require('./manifest.json').version)")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Error: Git tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION). Obsidian tags must not include a 'v' prefix."
            exit 1
          fi
          node -e "
            const versions = require('./versions.json');
            const manifest = require('./manifest.json');
            if (versions[manifest.version] !== manifest.minAppVersion) {
              console.error('Error: versions.json entry for ' + manifest.version + ' does not match manifest.minAppVersion (' + manifest.minAppVersion + ')');
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
